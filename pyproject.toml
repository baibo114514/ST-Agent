[project]
name = "langgraph-fastapi-template"
version = "0.3.0"
description = "LangGraph FastAPI Template - Full Featured Agent Platform"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # --- Web 框架 ---
    "fastapi>=0.121.0",
    "uvicorn>=0.34.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",  # uvloop 不支持 Windows，仅 Linux/macOS 安装
    "python-multipart>=0.0.20",

    # --- AI 与 LLM 框架 ---
    "langchain>=1.0.5",
    "langchain-core>=1.0.4",
    "langchain-openai>=1.0.2",
    "langchain-community>=0.4.1",
    "langchain-experimental>=0.3.0",

    # --- Agent 编排 ---
    "langgraph>=1.0.2",
    "langgraph-checkpoint-postgres>=3.0.1",

    # --- 搜索工具 ---
    "tavily-python>=0.5.0",
    "duckduckgo-search>=3.9.0",
    "ddgs>=9.6.0",

    # --- 监控 ---
    "langfuse==3.9.1",

    # --- 数据库 (核心依赖) ---
    "sqlmodel>=0.0.24",
    "psycopg[binary]>=3.3.2",
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.29.0",
    "supabase>=2.15.0",
    "pgvector>=0.3.6",

    # --- 数据校验 ---
    "pydantic[email]>=2.11.1",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.1.0",

    # --- 安全认证 ---
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.3.0",
    "python-jose[cryptography]>=3.4.0",

    # --- 日志 ---
    "structlog>=25.2.0",

    # --- 工具库 ---
    "slowapi>=0.1.9",
    "email-validator>=2.2.0",
    "asgiref>=3.8.1",
    "tenacity>=9.1.2",
    "colorama>=0.4.6",
    "httpx>=0.28.1",
    "jieba>=0.42.1",

    # ✅ 仅保留 PDF 轻量解析库
    "pymupdf>=1.23.0",
]

# ❌ [Deleted] 删除了导致报错的 [project.scripts] 块
# 因为 Dockerfile 已经定义了正确的 CMD 启动命令，这里不需要重复且错误的定义。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "services"]
